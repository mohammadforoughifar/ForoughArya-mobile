name: forough_mobile
description: "Forough Arya mobile client for authentication and work orders."
publish_to: 'none'

version: 1.70.0+79

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  # بومی‌سازی فارسی (MaterialLocalizations/CupertinoLocalizations) —
  # بدون این، ویجت‌های TextField و DatePicker در نسخهٔ release کادر خاکستری می‌شوند
  flutter_localizations:
    sdk: flutter

  speech_to_text: ^7.5.0
  dio: ^5.11.1
  provider: ^6.1.5+1
  flutter_secure_storage: ^11.2.0
  file_picker: ^13.3.2
  share_plus: ^13.3.1
  open_filex: ^5.0.0
  shamsi_date: ^1.1.1
  path_provider: ^2.1.6
  image_picker: ^1.2.4
  flutter_local_notifications: ^22.0.0
  web_socket_channel: ^3.0.3
  mobile_scanner: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn.ttf
          # کاهش حجم: نسخهٔ subset بهینه‌شده (فارسی/عربی + لاتین + علائم تایپوگرافی)
