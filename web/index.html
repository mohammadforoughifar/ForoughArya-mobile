<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <!-- آدرس پایهٔ پویا: اجرای بی‌نقص در ریشهٔ دامنه (/) یا هر زیرپوشهٔ سرور مانند (/app/) -->
  <script>
    (function () {
      var p = location.pathname;
      document.write('<base href="' + p.substring(0, p.lastIndexOf('/') + 1) + '">');
    })();
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- جلوگیری از زوم ناخواستهٔ Safari آیفون هنگام فوکوس روی فیلدهای متنی + پوشش کامل ناچ و Dynamic Island -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="وب‌اپلیکیشن جامع سازمانی فروغ آریا ویژهٔ آیفون (iOS Safari PWA) و مرورگرهای مدرن">
  <meta name="theme-color" content="#101d49" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#101d49" media="(prefers-color-scheme: light)">
  <meta name="format-detection" content="telephone=no">

  <!-- متا تگ‌های استاندارد اپل برای اجرای تمام‌صفحهٔ بومی (Add to Home Screen) در iPhone و iPad -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="فروغ آریا">

  <!-- آیکن‌های Retina آیفون و آیپد -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="120x120" href="icons/apple-touch-icon-120x120.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152x152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167x167.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180x180.png">

  <!-- صفحات آغازین (Splash Screens) اختصاصی تمام مدل‌های iPhone و iPad در حالت Standalone -->
  <link rel="apple-touch-startup-image" href="splash/iphone-16-pro-max.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/iphone-16-pro.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/iphone-15-pro-max.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/iphone-15-pro.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/iphone-14-plus.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/iphone-14.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/iphone-x-xs.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/iphone-xr-11.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/iphone-8-plus.png" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/iphone-se.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/ipad-pro-11.png" media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/ipad-air-10.png" media="(device-width: 820px) and (device-height: 1180px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>فروغ آریا</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #101d49;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-text-size-adjust: 100%;
      user-select: none;
      -webkit-user-select: none;
    }
    /* جلوگیری از زوم خودکار سافاری آیفون روی المان‌های متنی مخفی فلاتر */
    input, textarea, select, [contenteditable="true"] {
      font-size: 16px !important;
      user-select: text;
      -webkit-user-select: text;
    }
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: linear-gradient(225deg, #101d49 0%, #2547a8 55%, #5136a7 100%);
      color: #ffffff;
      font-family: Tahoma, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      transition: opacity .35s ease;
    }
    #splash img {
      width: 92px;
      height: 92px;
      border-radius: 23px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, .38);
    }
    #splash .t { font-size: 21px; font-weight: 800; letter-spacing: -.2px; }
    #splash .sub { font-size: 12px; opacity: .78; }
    #splash .bar {
      width: 136px;
      height: 4px;
      border-radius: 99px;
      background: rgba(255, 255, 255, .2);
      overflow: hidden;
    }
    #splash .bar::after {
      content: "";
      display: block;
      width: 42%;
      height: 100%;
      background: #ffffff;
      border-radius: 99px;
      animation: foroughLoad 1.1s ease-in-out infinite;
    }
    @keyframes foroughLoad {
      0% { transform: translateX(260%); }
      100% { transform: translateX(-160%); }
    }
  </style>

  <!-- تنظیمات سرور قابل‌ویرایش در زمان اجرا + پل بومی iOS Safari PWA -->
  <script src="pwa-config.js"></script>
  <script src="ios-pwa-helper.js"></script>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="فروغ آریا">
    <div class="t">سامانه جامع فروغ آریا</div>
    <div class="bar"></div>
    <div class="sub">در حال آماده‌سازی محیط کاری…</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) {
        s.style.opacity = '0';
        setTimeout(function () { try { s.remove(); } catch (_) {} }, 380);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
