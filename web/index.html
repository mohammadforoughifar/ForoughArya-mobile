<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <!-- آدرس پایه پویا: نسخهٔ وب در هر مسیری از سرور (مثلاً /app/) کار می‌کند -->
  <script>
    (function () {
      var p = location.pathname;
      document.write('<base href="' + p.substring(0, p.lastIndexOf('/') + 1) + '">');
    })();
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="سامانهٔ سازمانی فروغ آریا">
  <meta name="theme-color" content="#2547a8">

  <!-- آیفون: اجرای تمام‌صفحه بعد از «افزودن به صفحهٔ اصلی» -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="فروغ آریا">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>فروغ آریا</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #101d49; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: linear-gradient(225deg, #101d49, #2547a8 55%, #5136a7);
      color: #fff; font-family: Tahoma, system-ui, sans-serif;
      transition: opacity .35s ease;
    }
    #splash img { width: 88px; height: 88px; border-radius: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,.35); }
    #splash .t { font-size: 20px; font-weight: 700; }
    #splash .s { font-size: 13px; opacity: .75; }
    #splash .bar { width: 120px; height: 4px; border-radius: 4px;
      background: rgba(255,255,255,.2); overflow: hidden; }
    #splash .bar::after { content: ""; display: block; width: 40%; height: 100%;
      background: #fff; border-radius: 4px; animation: load 1.1s ease-in-out infinite; }
    @keyframes load { 0% { transform: translateX(260%); } 100% { transform: translateX(-160%); } }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="">
    <div class="t">فروغ آریا</div>
    <div class="bar"></div>
    <div class="s">در حال بارگذاری…</div>
  </div>
  <script>
    // حذف صفحهٔ بارگذاری وقتی اولین فریم Flutter رسم شد
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) { s.style.opacity = '0'; setTimeout(function () { s.remove(); }, 400); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
