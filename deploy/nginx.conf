server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
        text/javascript mjs;
        application/manifest+json webmanifest;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        font/ttf
        font/otf
        image/svg+xml;

    # فایل‌های حساس به به‌روزرسانی آنی هرگز در کش مرورگر قفل نشوند
    location ~* ^/(index\.html|sw\.js|pwa-config\.js|manifest\.json|version\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # فایل‌های سنگین موتور گرافیکی و فونت‌ها با کش بلندمدت سرو شوند
    location ~* \.(wasm|ttf|otf|woff2|png|jpg|jpeg|webp|ico)$ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # نمونهٔ پروکسی معکوس اختیاری به بک‌اند ASP.NET Core روی همان سرور:
    # location /api/ {
    #     proxy_pass http://127.0.0.1:5100/api/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
    # location /hubs/ {
    #     proxy_pass http://127.0.0.1:5100/hubs/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header Host $host;
    # }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
